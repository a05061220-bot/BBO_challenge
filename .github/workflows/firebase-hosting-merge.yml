name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BBO_CHALLENGE_88640 }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          set +e
          npx -y firebase-tools@13.35.1 deploy --only hosting --project bbo-challenge-88640 --non-interactive 2>&1 | tee "$RUNNER_TEMP/firebase-deploy.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 80 "$RUNNER_TEMP/firebase-deploy.log" | sed 's/%/%25/g; s/\r/%0D/g; s/$/%0A/g' | tr -d '\n' | sed 's/^/::error::Firebase deploy failed:%0A/'
          fi
          exit "$status"
