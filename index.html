<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>120-0 CPBL Draft</title>

<style>
:root{
--bg:#071225;
--panel:#10264f;
--panel-deep:#0c1d3d;
--line:rgba(245,200,76,.2);
--gold:#f5c84c;
--gold-soft:#ffd76b;
--text:#f4f7ff;
--muted:#9aa9c9;
}

*{
box-sizing:border-box;
font-family:"Segoe UI","Microsoft JhengHei","Noto Sans TC",sans-serif;
}

body{
margin:0;
min-height:100vh;
color:var(--text);
background:
radial-gradient(circle at top, rgba(38,76,150,.35), transparent 34%),
linear-gradient(180deg, #081127 0%, #09182d 44%, #071225 100%);
}

.container{
max-width:1440px;
margin:auto;
padding:18px;
}

h1{
margin:6px 0 18px;
text-align:center;
letter-spacing:.08em;
color:var(--gold-soft);
}

.layout{
display:flex;
gap:18px;
align-items:stretch;
}

.layout > div:first-child{
order:1;
flex:1;
display:flex;
flex-direction:column;
gap:18px;
}

.layout > div:last-child{
order:2;
flex:0 0 38%;
}

.card{
background:linear-gradient(180deg, rgba(17,38,79,.96), rgba(12,29,61,.96));
border:1px solid rgba(255,255,255,.06);
border-radius:22px;
padding:18px;
box-shadow:0 18px 45px rgba(0,0,0,.28);
}

.layout > div:last-child .card{
min-height:100%;
}

.card h2{
margin-top:0;
margin-bottom:14px;
color:var(--gold-soft);
}

button{
background:linear-gradient(180deg, #f6cf63, #e3b735);
border:none;
padding:12px 18px;
border-radius:12px;
font-weight:700;
cursor:pointer;
color:#191919;
box-shadow:0 8px 22px rgba(245,200,76,.18);
}

button:hover{opacity:.96;}
button:disabled{
background:#666;
cursor:not-allowed;
box-shadow:none;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:12px;
flex-wrap:wrap;
}

.actions{
display:flex;
gap:8px;
align-items:center;
flex-wrap:wrap;
}

.info{
font-size:18px;
font-weight:700;
}

#teamInfo{
padding:10px 14px;
border-radius:16px;
border:1px solid rgba(255,255,255,.08);
background:rgba(8,14,30,.45);
}

#selectionInfo{
margin-top:10px;
padding:10px 12px;
border-radius:14px;
background:rgba(245,200,76,.08);
border:1px solid rgba(245,200,76,.15);
color:#eed98d;
}

.player-list{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:10px;
margin-top:12px;
max-height:720px;
overflow:auto;
padding-right:4px;
}

.player{
background:rgba(10,25,52,.92);
padding:10px;
border-radius:14px;
border:1px solid rgba(255,255,255,.06);
transition:transform .15s ease,border-color .15s ease;
}

.player:hover{
border-color:var(--gold);
transform:translateY(-1px);
}

.player.selected{
border-color:#ffd76b;
box-shadow:0 0 0 1px rgba(245,200,76,.2),0 0 18px rgba(245,200,76,.18);
background:rgba(17,44,86,.96);
}

.player label{
display:block;
cursor:pointer;
}

.badge{
display:inline-block;
padding:3px 8px;
background:var(--gold);
color:#111;
border-radius:999px;
font-size:12px;
margin-left:5px;
font-weight:700;
}

.badge.unavailable{
background:#666;
color:#d7d7d7;
}

.badge.eligible{
background:var(--gold-soft);
color:#111;
}

.player-name{
display:inline-block;
padding:2px 5px;
border-radius:2px;
color:#fff;
font-size:13px;
line-height:1.25;
text-shadow:0 1px 1px rgba(0,0,0,.7);
box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);
}

.player-name.card-blue{background:#2657a6;}
.player-name.card-yellow{background:#a9770d;}
.player-name.card-red{background:#a92d3c;}
.player-name.card-purple{background:#59308d;}

.player.unavailable .player-name{
filter:saturate(.35);
opacity:.78;
}

.stats{
margin-top:6px;
line-height:1.45;
color:#fff;
}

.stats-grid{
display:grid;
grid-template-columns:repeat(2,minmax(76px,1fr));
gap:3px 14px;
padding:7px 9px;
border-radius:8px;
background:rgba(2,8,20,.38);
font-size:13px;
}

.stat-item{
display:flex;
justify-content:space-between;
gap:10px;
color:#b8c3db;
}

.stat-item strong{
color:#f1f4fb;
font-weight:700;
font-variant-numeric:tabular-nums;
}

.stat-item strong.stat-high{
color:#ef5664;
}

.stats.unavailable{
color:#8f9bb8;
}

.stats.unavailable .stat-item,
.stats.unavailable .stat-item strong,
.stats.unavailable .stat-item strong.stat-high{
color:#8f9bb8;
}

.team-grid{
position:relative;
min-height:640px;
padding:18px;
border-radius:18px;
background:
radial-gradient(circle at center, rgba(255,255,255,.06), transparent 28%),
linear-gradient(180deg, #2d9250, #1f643c);
border:1px solid rgba(255,255,255,.06);
position:relative;
overflow:hidden;
}

.team-grid::before{
content:"";
position:absolute;
left:50%;
top:50%;
width:56%;
height:56%;
border:2px solid rgba(255,236,190,.55);
transform:translate(-50%,-50%) rotate(45deg);
border-radius:8px;
opacity:.72;
pointer-events:none;
}

.field-slot,
.pitcher-slot{
background:rgba(14,24,45,.85);
padding:12px 10px;
border-radius:12px;
font-size:14px;
min-height:72px;
position:relative;
z-index:1;
text-align:center;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
box-shadow:0 8px 18px rgba(0,0,0,.16);
}

.field-slot{
position:absolute;
left:var(--x);
top:var(--y);
transform:translate(-50%,-50%);
width:108px;
}

.field-slot.clickable,
.pitcher-slot.clickable{
cursor:pointer;
transition:transform .15s ease,border-color .15s ease,background .15s ease,box-shadow .15s ease;
border:1px solid rgba(245,200,76,.18);
}

.field-slot.clickable.eligible,
.pitcher-slot.clickable.eligible{
border-color:#ffd76b;
box-shadow:0 0 0 1px rgba(245,200,76,.18),0 0 14px rgba(245,200,76,.16);
background:#132c56;
}

.field-slot.clickable:hover,
.pitcher-slot.clickable:hover{
border-color:#f5c84c;
box-shadow:0 0 0 1px rgba(245,200,76,.24),0 10px 22px rgba(0,0,0,.2);
}

.rewind-btn{
min-width:44px;
padding:12px 14px;
border-radius:50%;
font-size:18px;
line-height:1;
}

.field-slot.occupied,
.pitcher-slot.occupied{
background:#16315f;
color:#fff;
}

.field-slot.empty,
.pitcher-slot.empty{
color:#aab6d6;
}

.pitcher-board{
margin-top:14px;
padding:14px;
border-radius:18px;
background:linear-gradient(180deg, rgba(14,24,45,.96), rgba(10,20,38,.96));
border:1px solid rgba(255,255,255,.06);
}

.pitcher-title{
display:flex;
align-items:center;
gap:8px;
margin-bottom:12px;
font-size:14px;
color:#d7e2ff;
}

.pitcher-grid{
display:grid;
grid-template-columns:repeat(3,minmax(0,1fr));
gap:10px;
}

.field-slot b,
.pitcher-slot b{
font-size:13px;
margin-bottom:4px;
}

.field-slot br,
.pitcher-slot br{
line-height:1.2;
}

.result{
margin-top:14px;
text-align:center;
font-size:28px;
font-weight:800;
color:var(--gold-soft);
}

.comparison-info{
margin-top:10px;
text-align:center;
color:var(--muted);
font-size:13px;
line-height:1.6;
}

@media(max-width:1100px){
.layout{
flex-direction:column;
}

.layout > div:first-child,
.layout > div:last-child{
order:unset;
flex:unset;
}
}

@media(max-width:900px){
.player-list{
max-height:none;
}

.team-grid{
min-height:560px;
}

.field-slot{
width:92px;
}

.pitcher-grid{
grid-template-columns:repeat(2,minmax(0,1fr));
}
}
</style>
</head>
<body>

<div class="container">

<h1>⚾ 120-0 CPBL Draft</h1>

<div class="layout">

<div>

<div class="card">
<script src="BBO_Search/bbo-data.js"></script>

<div class="topbar">

<div id="teamInfo" class="info">
按下 SPIN 開始
</div>

<div class="actions">
<button class="rewind-btn" onclick="remakeDraft()" title="重新選秀">
♻
</button>

<button onclick="spinTeam()">
🎲 SPIN
</button>
</div>

</div>

<div id="selectionInfo"></div>

<div class="team-grid">
<div id="fieldRoster"></div>
</div>

<div class="pitcher-board">
<div class="pitcher-title">
投手群（下方欄位）
</div>
<div id="pitcherRoster" class="pitcher-grid"></div>
</div>

</div>

<div class="card">

<h2>模擬球季</h2>

<button onclick="simulateSeason()">
模擬120場
</button>

<div id="result" class="result"></div>

</div>

</div>

<div>

<div class="card">

<div class="topbar">
<h2 style="margin:0;">
選秀名單
</h2>
<div class="counter" id="counter">
0 / 15
</div>
</div>

<div id="players" class="player-list"></div>

</div>

</div>

</div>

</div>
<script src="config.js"></script>
<script src="app.js"></script>

</body>
</html>
